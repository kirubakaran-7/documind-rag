<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a4e8a">DocuMind — RAG Pipeline</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Indexing row -->
  <text x="30" y="88" font-size="13" font-weight="700" fill="#94a3b8">INDEXING</text>

  <rect x="30" y="100" width="140" height="64" rx="10" fill="#eef4fb" stroke="#1a4e8a" stroke-width="1.5"/>
  <text x="100" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Documents</text>
  <text x="100" y="147" text-anchor="middle" font-size="11" fill="#64748b">PDF / TXT / MD</text>

  <rect x="215" y="100" width="140" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="285" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Chunk</text>
  <text x="285" y="147" text-anchor="middle" font-size="11" fill="#64748b">split w/ overlap</text>

  <rect x="400" y="100" width="140" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Embed</text>
  <text x="470" y="147" text-anchor="middle" font-size="11" fill="#64748b">vectors</text>

  <rect x="585" y="92" width="150" height="80" rx="10" fill="#eaf7ee" stroke="#2f9e57" stroke-width="1.5"/>
  <text x="660" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">ChromaDB</text>
  <text x="660" y="146" text-anchor="middle" font-size="11" fill="#64748b">vector store</text>

  <line x1="170" y1="132" x2="212" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="355" y1="132" x2="397" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="540" y1="132" x2="582" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Query row -->
  <text x="30" y="238" font-size="13" font-weight="700" fill="#94a3b8">QUERY</text>

  <rect x="30" y="250" width="150" height="64" rx="10" fill="#eef4fb" stroke="#1a4e8a" stroke-width="1.5"/>
  <text x="105" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Question</text>
  <text x="105" y="297" text-anchor="middle" font-size="11" fill="#64748b">from user</text>

  <rect x="300" y="250" width="180" height="64" rx="10" fill="#1a4e8a"/>
  <text x="390" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Retrieve top-k</text>
  <text x="390" y="297" text-anchor="middle" font-size="11" fill="#cfe0f3">semantic search</text>

  <rect x="560" y="250" width="150" height="64" rx="10" fill="#1a4e8a"/>
  <text x="635" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LLM</text>
  <text x="635" y="297" text-anchor="middle" font-size="11" fill="#cfe0f3">grounded answer</text>

  <rect x="740" y="250" width="120" height="64" rx="10" fill="#fff7e6" stroke="#e0a12b" stroke-width="1.5"/>
  <text x="800" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Answer</text>
  <text x="800" y="297" text-anchor="middle" font-size="11" fill="#64748b">+ sources</text>

  <line x1="180" y1="282" x2="297" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="480" y1="282" x2="557" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="710" y1="282" x2="737" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <!-- store to retrieve -->
  <path d="M660 172 C 660 215, 430 210, 392 248" fill="none" stroke="#2f9e57" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="470" y="205" font-size="11" fill="#2f9e57">context</text>

  <text x="440" y="358" text-anchor="middle" font-size="12" fill="#94a3b8">Python · LangChain · ChromaDB · OpenAI / Ollama · Streamlit</text>
</svg>
